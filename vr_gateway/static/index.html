<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AlohaMini VR Teleop</title><style>
:root{color-scheme:dark}body{margin:0;background:#101217;color:#eee;font:16px system-ui,sans-serif}main{max-width:960px;margin:auto;padding:12px}#view{display:block;width:100%;max-height:66vh;object-fit:contain;background:#000;border-radius:8px}button,input{font:inherit}button{padding:.55rem .8rem;margin:.25rem;border:0;border-radius:6px;background:#304a68;color:#fff}button:active{background:#567da6}.danger{background:#a32f35}.row{display:flex;flex-wrap:wrap;align-items:center;gap:.3rem}.panel{margin-top:.5rem;padding:.5rem;background:#1b1f29;border-radius:8px}.joystick{width:110px;height:110px;border-radius:50%;background:#333;position:relative;touch-action:none}.stick{width:38px;height:38px;border-radius:50%;background:#71a3d8;position:absolute;left:36px;top:36px}.label{min-width:80px}#status{margin-left:.5rem;color:#9dd39d}#input-log{margin:.5rem 0 0;min-height:1.2em;max-height:7em;overflow:auto;color:#b8c7d9;font:12px ui-monospace,monospace;white-space:pre-wrap}</style></head>
<body><main><h2>AlohaMini VR teleoperation</h2><img id="view" alt="forward camera"><canvas id="xr-canvas" width="1024" height="1024" hidden></canvas><div class="panel row"><button id="vr">Enter immersive VR</button><button id="estop" class="danger">E-STOP</button><button id="reset-estop">Release E-STOP</button><span id="status">connecting…</span></div><div class="panel row"><span class="label">Base</span><div id="joystick" class="joystick" aria-label="base joystick"><div class="stick"></div></div><label>Lift <input id="lift" type="range" min="0" max="500" value="250" step="1"></label><span id="lift-value">250 mm</span></div><div class="panel row"><label>Gripper <input id="gripper" type="range" min="0" max="1" value="0" step=".01"></label><span id="gripper-value">0%</span><button id="calibrate">Calibrate</button><button id="clutch">Clutch: off</button></div><pre id="input-log" aria-live="polite"></pre><p>VR 控制：左摇杆=前后/平移，右摇杆=旋转，B=上升，A=下降。请在 Quest 中点击 Enter immersive VR 后操作手柄。</p></main><script src="/static/app.js"></script></body></html>
